<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alex Rivera — Full-Stack Developer & AI Engineer. Portfolio of high-performance web apps, mobile products, and AI experiences."
    />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="Alex Rivera · Developer Portfolio" />
    <meta
      property="og:description"
      content="I craft fast, accessible digital experiences that feel inevitable."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Alex Rivera · Developer Portfolio</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("portfolio-theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else if (t === "dark") document.documentElement.classList.add("dark");
          else if (window.matchMedia("(prefers-color-scheme: light)").matches)
            document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
